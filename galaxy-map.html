 between Helix and Voidborne — the \"Korsakov Belt Incident.\" Helix suffered significant losses here; Voidborne denies involvement. Rich in rare minerals. Legal ownership disputed. Dangerous to operate in.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"KB-0.774","tags":["atlas","Asteroid Belt","Contested (Helix / Voidborne)","◉ Hook","KB-0.774"]},{"id":"augment-city","name":"Augment City","x":1644,"y":1926,"zone":"lawless","faction":"synthesis","type":"colony","status":"active","isCampaign":false,"desc":"Planet; Synthesis Biotechnologies; jump point AC-0.667. Chart note: Synthesis colony. 100,000 workers. Affordable augmentation clinics and frontier biotech infrastructure.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"AC-0.667","tags":["atlas","Planet","Synthesis Biotechnologies","◆ Lore","Synthesis colony","AC-0.667"]},{"id":"concordat-assembly-ring","name":"Concordat Assembly Ring","x":1186,"y":946,"zone":"core","faction":"concordat","type":"station","status":"neutral","isCampaign":false,"desc":"Station; Concordat Government; jump point ASSY-B1. Chart note: Neutral orbit, core space. The main seat of Concordat government — enormous orbital ring station above a neutral planet. Where species councils and corporate delegates battle for influence. Assembly Speaker Zara Venn presides. Useful for political pressure, backroom deals, or blowing up a careers.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"ASSY-B1","tags":["atlas","Station","Concordat Government","Hook","Neutral orbit, core space","ASSY-B1"]},{"id":"harmonium-cathedral-station","name":"Harmonium Cathedral Station","x":1290,"y":630,"zone":"core","faction":"harmonium","type":"station","status":"active","isCampaign":false,"desc":"Station; Harmonium Church; jump point NC-B2. Chart note: New Covenant system. The Church's central administrative hub in orbit above New Covenant. Not a religious building — a fortress disguised as one. High Inquisitor Severin Kade's seat of power. Pilgrims and Inquisitors share the same corridors. Surveillance here is total.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"NC-B2","tags":["atlas","Station","Harmonium Church","Hook","New Covenant system","NC-B2"]},{"id":"kethran-embassy-station","name":"Kethran Embassy Station","x":840,"y":450,"zone":"frontier","faction":"concordat","type":"station","status":"neutral","isCampaign":false,"desc":"Station; Kethran diplomatic corps; jump point KE-T1. Chart note: Stable frontier, orbital. Kethran-designed diplomatic outpost near the frontier. Where species mediate before conflicts escalate. Beautiful organic architecture. Psionics are baseline-active throughout — deception is difficult. Genuinely neutral ground.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"KE-T1","tags":["atlas","Station","Kethran diplomatic corps","Hook","Stable frontier, orbital","KE-T1"]},{"id":"the-salvator-mundi","name":"The Salvator Mundi","x":426,"y":822,"zone":"frontier","faction":"concordat","type":"derelict-ship","status":"active","isCampaign":false,"desc":"Derelict; Concordat Heritage Trust; jump point SM-T2. Chart note: Drifting, stable frontier. A first-wave generation ship discovered drifting, population long dead. Now converted into a memorial museum. Eerie interior — original furniture, clothing, and personal logs still intact. Ghost tourism. But something in the deep holds triggers sensor anomalies that the Trust quietly suppresses.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"SM-T2","tags":["atlas","Derelict","Concordat Heritage Trust","Hook","Drifting, stable frontier","SM-T2"]},{"id":"deepwell-colony","name":"Deepwell Colony","x":1812,"y":1830,"zone":"deep","faction":"horizons","type":"colony","status":"active","isCampaign":false,"desc":"Planet; Horizons Dynamics / Kowalski Forged; jump point DW-0.884. Deep-core drilling colony on a geologically active world. Mostly Kowalski Forged workers — shortened lifespan, hard labor, tension simmering. The drill recently broke through to a sealed chamber no geological survey predicted. Horizon management is keeping it quiet. It should not be kept quiet.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"DW-0.884","tags":["atlas","Planet","Horizons Dynamics / Kowalski Forged","Hook","DW-0.884"]},{"id":"sable-station","name":"Sable Station","x":1566,"y":270,"zone":"deep","faction":"independent","type":"station","status":"active","isCampaign":true,"desc":"Station; Chimera Biosystems; jump point SB-0.112 / Private. Chart note: Restricted xenobiological research outpost. Private access only.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"","tags":["atlas","Station","Chimera Biosystems","Hook"]},{"id":"the-driftyard","name":"The Driftyard","x":2520,"y":1050,"zone":"deep","faction":"independent","type":"derelict-ship","status":"hostile","isCampaign":true,"desc":"Derelict; Drifter community (independent); jump point DY-0.559. A massive collection of decommissioned and wrecked ships lashed together into a semi-functional station. Home to 15,000 Drifters. Only community in the region with zero corporate affiliation. Hostile to outsiders but invaluable for salvage and black-market ship parts. No names given, no names taken.","sessionLog":"A massive collection of decommissioned and wrecked ships lashed together into a semi-functional station. Home to 15,000 Drifters. Only community in the region with zero corporate affiliation. Hostile to outsiders but invaluable for salvage and black-market ship parts. No names given, no names taken.","parentId":"","pois":[],"jumpPoint":"DY-0.559","tags":["atlas","Derelict","Drifter community (independent)","Hook","DY-0.559"]},{"id":"mercy-point","name":"Mercy Point","x":990,"y":1770,"zone":"deep","faction":"concordat","type":"station","status":"neutral","isCampaign":false,"desc":"Station; Kethran / Nisara joint; jump point MP-0.337. Chart note: Neutral medical station. Neutral medical station maintained jointly by the Kethran and Nisara communities. Treats anyone, asks nothing, charges what you can afford. One of the only places in frontier space that treats Forged as patients rather than property. A genuine sanctuary — everyone knows shooting here is suicide for your reputation.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"MP-0.337","tags":["atlas","Station","Kethran / Nisara joint","Hook","Neutral medical station","MP-0.337"]},{"id":"the-architects-eye","name":"The Architect's Eye","x":1410,"y":2046,"zone":"lawless","faction":"harmonium","type":"ancient-structure","status":"active","isCampaign":true,"desc":"Ancient Structure; Harmonium; jump point Restricted / Harmonium. Chart note: Moon-sized ancient structure under Church interdiction. Ships are warned not to linger near the anomaly.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"","tags":["atlas","Guardian Ruin","Hook","Active Guardian ruin"]},{"id":"ashport","name":"Ashport","x":510,"y":1950,"zone":"lawless","faction":"redsuns","type":"colony","status":"destroyed","isCampaign":false,"desc":"Planet; None / Red Suns occasional; jump point AP-0.774 / Offline. Chart note: Abandoned colony. Colony of 12,000, abandoned six years ago after a Vrynn raid destroyed the water reclamation systems. Shells of buildings, personal effects still in homes. Red Suns occasionally resupply here. The beacon was destroyed in the raid. Unsettlingly intact.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"AP-0.774 / Offline","tags":["atlas","Planet","None / Red Suns occasional","Hook","Abandoned colony","AP-0.774 / Offline"]},{"id":"grave-anchor","name":"Grave Anchor","x":2493,"y":1713,"zone":"lawless","faction":"redsuns","type":"derelict-ship","status":"active","isCampaign":true,"desc":"Derelict; Various pirates (rotating); jump point GA-1.223. Chart note: Derelict military cruiser. A Concordat cruiser from a war 300 years ago, drifting in a dead system's outer belt. Interior still pressurized — nobody knows how. Used by rotating pirate crews as a staging point. Someone left the reactor running. The original crew's personal logs are still in the barracks.","sessionLog":"A Concordat cruiser from a war 300 years ago, drifting in a dead system's outer belt. Interior still pressurized — nobody knows how. Used by rotating pirate crews as a staging point. Someone left the reactor running. The original crew's personal logs are still in the barracks.","parentId":"","pois":[],"jumpPoint":"GA-1.223","tags":["atlas","Derelict","Various pirates (rotating)","Hook","Derelict military cruiser","GA-1.223"]},{"id":"harrows-gate","name":"Harrow's Gate","x":2304,"y":1560,"zone":"lawless","faction":"harmonium","type":"station","status":"active","isCampaign":false,"desc":"Station; Harmonium (minimal presence); jump point HG-T3. Chart note: Last official waystation. The last officially-recognized waystation before the acknowledged edge of Concordat territory. One overworked Harmonium friar and a beacon that needs calibration. Beyond this, nav subscriptions technically don't cover you. People stop here to decide whether to turn back.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"HG-T3","tags":["atlas","Station","Harmonium (minimal presence)","Hook","Last official waystation","HG-T3"]},{"id":"sorivaan-institute-annex","name":"Sorivaan Institute Annex","x":1260,"y":150,"zone":"lawless","faction":"independent","type":"scientific-expedition","status":"active","isCampaign":true,"desc":"Station; Abandoned / Dr. Korin interest; jump point SI-0.441. Chart note: Kael's old outpost. The frontier research outpost where Kael was stationed when he discovered the Device. Officially shut down after his \"accident.\" Dr. Vetha Korin's people have been seen near it recently. Kael's old lab notes may still be here — and whatever else he left behind when he ran.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"SI-0.441","tags":["atlas","Station","Abandoned / Dr. Korin interest","Hook","Kael's old outpost","SI-0.441","◉ Hook","★ Visited"]},{"id":"wreck-of-     function useKinds(l){const text=searchText((l.tags||[]).join(" ")); const kinds=new Set(); if(text.includes("lore")||text.includes("◆"))kinds.add("lore"); if(text.includes("hook")||text.includes("◉"))kinds.add("hook"); if(text.includes("visited")||text.includes("★"))kinds.add("visited"); if(text.includes("mentioned")||text.includes("◈"))kinds.add("mentioned"); if(l.isCampaign)kinds.add("campaign"); if(l.status==="destroyed")kinds.add("destroyed"); if(l.status==="dark")kinds.add("dark"); return kinds}
    function matches(l){const q=state.search.toLowerCase(); if(state.zone!=="all"&&l.zone!==state.zone)return false; if(state.type!=="all"&&l.type!==state.type)return false; if(state.use!=="all"&&!useKinds(l).has(state.use))return false; const parent=l.parentId?loc(l.parentId)?.name:""; return !q || [JSON.stringify(l),zones[l.zone]?.name,factions[l.faction]?.name,typeLabels[l.type],[...useKinds(l)].map(k=>useLabels[k]).join(" "),parent].join(" ").toLowerCase().includes(q)}
    function starPoints(cx,cy,o,i,c=8){let p=[];for(let n=0;n<c*2;n++){const r=n%2?i:o,a=-Math.PI/2+n*Math.PI/c;p.push(`${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`)}return p.join(" ")}
    function drawNode(g,l){const color=factions[l.faction]?.color||"#687080";const n=el("g",{class:`node-group ${matches(l)?"":"dimmed"}`}); if(l.isCampaign)n.appendChild(el("circle",{class:"campaign-ring",cx:l.x,cy:l.y,r:15})); const base={class:"node-shape",stroke:color,fill:color,"fill-opacity":".18","stroke-width":"2"}; if(l.type==="capital")n.appendChild(el("polygon",{...base,points:starPoints(l.x,l.y,12,5.5)})); else if(l.type==="hq")n.appendChild(el("rect",{...base,x:l.x-8,y:l.y-8,width:16,height:16,transform:`rotate(45 ${l.x} ${l.y})`})); else if(l.type==="territory")n.appendChild(el("polygon",{...base,points:`${l.x},${l.y-11} ${l.x+10},${l.y+8} ${l.x-10},${l.y+8}`})); else n.appendChild(el("circle",{...base,cx:l.x,cy:l.y,r:7.5})); n.appendChild(el("circle",{class:"hit-area",cx:l.x,cy:l.y,r:18})); n.appendChild(el("text",{class:"node-label",x:l.x+12,y:l.y-11},l.name)); n.addEventListener("click",(e)=>{if(state.suppressClick)return;e.stopPropagation();state.selectedId=l.id;renderPanel()}); g.appendChild(n)}
    function draw(){map.innerHTML="";const root=el("g");["beyond","lawless","deep","frontier","core"].forEach(id=>root.appendChild(el("path",{class:"zone",d:zoneShapes[id],fill:zones[id].color,"fill-opacity":id==="beyond"?".08":".045",stroke:zones[id].color,"stroke-opacity":".75","stroke-width":"1.4"}))); data.routes.forEach(r=>{const a=loc(r.from),b=loc(r.to); if(!a||!b)return; const s={major:["#83b7ff",""],trade:["#b6a56f","8 7"],fringe:["#777b91","2 6"],campaign:["#f0d060","16 9"]}[r.type]||["#b6a56f","8 7"]; root.appendChild(el("line",{class:"route",x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:s[0],"stroke-width":r.type==="campaign"?2:1.35,"stroke-dasharray":s[1],"stroke-linecap":"round"}))}); data.locations.forEach(l=>{const p=l.parentId&&loc(l.parentId); if(p)root.appendChild(el("line",{x1:p.x,y1:p.y,x2:l.x,y2:l.y,stroke:"#f0d060","stroke-opacity":".24","stroke-width":"1","stroke-dasharray":"3 6"}))}); data.locations.forEach(l=>drawNode(root,l)); [["Core Worlds",1200,630],["Stable Frontier",1188,366],["Deep Frontier",1182,111],["Lawless Space",1170,1818],["Beyond Concordat",2130,108]].forEach(([t,x,y])=>root.appendChild(el("text",{class:"zone-label",x,y,"text-anchor":"middle"},t))); map.appendChild(root)}
    function publicSection(title,body,open=true){return '<details class="public-section" '+(open?'open':'')+'><summary>'+esc(title)+'</summary><div class="section-body">'+body+'</div></details>'}
    function renderPanel(){const l=loc(state.selectedId); if(!l){panel.innerHTML='<div class="empty"><h2>Select a location</h2><p>Click any chart marker to inspect known public information.</p></div>';return} const tags=['<span class="tag">'+esc(zones[l.zone]?.name||l.zone)+'</span>','<span class="tag">'+esc(factions[l.faction]?.name||l.faction)+'</span>','<span class="tag">'+esc(typeLabels[l.type]||l.type)+'</span>']; if(l.jumpPoint)tags.push('<span class="tag">'+esc(l.jumpPoint)+'</span>'); if(l.isCampaign)tags.push('<span class="tag campaign">Campaign</span>'); const parent=l.parentId&&loc(l.parentId); const children=data.locations.filter(c=>c.parentId===l.id).sort((a,b)=>a.name.localeCompare(b.name)); const pois=(l.pois||[]); const relation=[parent?'<p style="color:#a99d7b">Near / inside '+esc(parent.name)+'</p>':'',children.length?'<p style="color:#a99d7b">Contains '+children.map(c=>esc(c.name)).join(", ")+'</p>':''].join(""); const descHtml='<p>'+esc(l.desc||"No public record available.")+'</p>'; const poiHtml=pois.length?'<ul class="poi-list">'+pois.map(p=>'<li><strong>'+esc(p.name)+'</strong>'+(p.notes?'<br>'+esc(p.notes):'')+'</li>').join("")+'</ul>':'<p>No public points of interest recorded.</p>'; const sessionHtml='<p>'+esc(l.sessionLog||"No public session notes recorded.")+'</p>'; panel.innerHTML='<h2>'+esc(l.name)+'</h2><div class="tags">'+tags.join("")+'</div>'+relation+publicSection('Description',descHtml,true)+publicSection('Points of Interest',poiHtml,true)+publicSection('Session Notes',sessionHtml,false)}
    function renderLegend(){const box=document.getElementById("legend");box.classList.toggle("show",state.showLegend);const rows=Object.entries(zones).map(([id,z])=>'<div class="legend-item"><span class="swatch" style="background:'+z.color+'"></span>'+esc(z.name)+'</div>').join("");box.innerHTML='<div class="legend-title">Zones</div><div class="legend-grid">'+rows+'</div><div class="legend-title">Routes</div><div class="legend-grid"><div class="legend-item"><span class="line-key major"></span>Major</div><div class="legend-item"><span class="line-key trade"></span>Trade</div><div class="legend-item"><span class="line-key fringe"></span>Fringe</div><div class="legend-item"><span class="line-key campaign"></span>Campaign</div></div><div class="legend-title">Markers</div><div class="legend-grid"><div class="legend-item"><span class="swatch" style="background:#3a85d8;clip-path:polygon(50% 0,61% 35%,100% 35%,68% 56%,80% 100%,50% 72%,20% 100%,32% 56%,0 35%,39% 35%)"></span>Capital</div><div class="legend-item"><span class="swatch" style="background:#c98c18;transform:rotate(45deg) scale(.75)"></span>HQ</div><div class="legend-item"><span class="swatch" style="background:#687080;border-radius:50%"></span>World / Station</div><div class="legend-item"><span class="swatch" style="background:#68a028;clip-path:polygon(50% 0,100% 100%,0 100%)"></span>Territory</div><div class="legend-item"><span class="swatch" style="background:#230708;border-radius:50%"></span>Pirate Base</div><div class="legend-item"><span class="swatch" style="background:#f0d060;border-radius:50%;box-shadow:0 0 0 3px rgba(240,208,96,.34)"></span>Campaign</div><div class="legend-item"><span class="swatch" style="background:#687080;border-radius:50%"><span style="position:absolute;left:-2px;top:5px;width:16px;border-top:2px solid #ff5454;transform:rotate(45deg)"></span><span style="position:absolute;left:-2px;top:5px;width:16px;border-top:2px solid #ff5454;transform:rotate(-45deg)"></span></span>Destroyed</div><div class="legend-item"><span class="swatch" style="background:#303442;border-radius:50%;box-shadow:inset 0 0 0 4px #687080"></span>Gone Dark</div></div><div class="legend-title">Snapshot</div><p style="margin:0;color:#a99d7b;font-size:12px">Player-safe public snapshot.</p>'}
    function updateViewBox(){map.setAttribute("viewBox",`${state.pan.x} ${state.pan.y} ${3900/state.zoom} ${3000/state.zoom}`)}
    function screenToSvgPoint(event){const p=map.createSVGPoint();const touch=event.touches?.[0]||event.changedTouches?.[0]||event;p.x=touch.clientX;p.y=touch.clientY;return p.matrixTransform(map.getScreenCTM().inverse())}
    let isDragging=false,dragStart=null,panStart=null,lastTouchDistance=null,lastTouchMidpoint=null;
    function touchDistance(touches){return Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY)}
    function touchMidpoint(touches){return {clientX:(touches[0].clientX+touches[1].clientX)/2,clientY:(touches[0].clientY+touches[1].clientY)/2}}
    function zoomAt(eventLike,factor){const before=screenToSvgPoint(eventLike);state.zoom=Math.min(4,Math.max(.3,state.zoom*factor));updateViewBox();const after=screenToSvgPoint(eventLike);state.pan.x+=before.x-after.x;state.pan.y+=before.y-after.y;updateViewBox()}
    map.addEventListener("mousedown",e=>{if(e.button!==0||e.target.closest(".node-group"))return;isDragging=true;dragStart={x:e.clientX,y:e.clientY};panStart={...state.pan};state.suppressClick=false;map.classList.add("dragging")});
    window.addEventListener("mousemove",e=>{if(!isDragging)return;const rect=map.getBoundingClientRect();const dx=(e.clientX-dragStart.x)/rect.width*(3900/state.zoom);const dy=(e.clientY-dragStart.y)/rect.height*(3000/state.zoom);if(Math.abs(e.clientX-dragStart.x)+Math.abs(e.clientY-dragStart.y)>4)state.suppressClick=true;state.pan.x=panStart.x-dx;state.pan.y=panStart.y-dy;updateViewBox()});
    window.addEventListener("mouseup",()=>{isDragging=false;map.classList.remove("dragging");setTimeout(()=>{state.suppressClick=false},0)});
    map.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e,e.deltaY>0?.9:1.1)},{passive:false});
    map.addEventListener("touchstart",e=>{if(e.touches.length===1){isDragging=true;dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};panStart={...state.pan};state.suppressClick=false}else if(e.touches.length===2){isDragging=false;lastTouchDistance=touchDistance(e.touches);lastTouchMidpoint=touchMidpoint(e.touches)}},{passive:false});
    map.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches.length===1&&isDragging){const rect=map.getBoundingClientRect();const dx=(e.touches[0].clientX-dragStart.x)/rect.width*(3900/state.zoom);const dy=(e.touches[0].clientY-dragStart.y)/rect.height*(3000/state.zoom);state.suppressClick=true;state.pan.x=panStart.x-dx;state.pan.y=panStart.y-dy;updateViewBox()}else if(e.touches.length===2){const next=touchDistance(e.touches);const midpoint=touchMidpoint(e.touches);if(lastTouchDistance)zoomAt(midpoint,next/lastTouchDistance);lastTouchDistance=next;lastTouchMidpoint=midpoint}},{passive:false});
    map.addEventListener("touchend",()=>{isDragging=false;lastTouchDistance=null;lastTouchMidpoint=null;setTimeout(()=>{state.suppressClick=false},0)});
    function starfield(){const c=document.getElementById("starfield"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.fillStyle="#06060c";x.fillRect(0,0,c.width,c.height);let seed=4892,rand=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};for(let i=0;i<620;i++){x.beginPath();x.fillStyle=`rgba(240,231,190,${rand()*.65+.12})`;x.arc(rand()*c.width,rand()*c.height,(rand()*1.35+.25)*d,0,Math.PI*2);x.fill()}}
    document.getElementById("search").oninput=e=>{state.search=e.target.value;draw()}; document.getElementById("zone").onchange=e=>{state.zone=e.target.value;draw()}; document.getElementById("type").onchange=e=>{state.type=e.target.value;draw()}; document.getElementById("use").onchange=e=>{state.use=e.target.value;draw()}; document.getElementById("legendBtn").onclick=()=>{state.showLegend=!state.showLegend;renderLegend()};
    function fill(sel, vals, labels){const s=document.getElementById(sel);vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=labels[v]?.name||labels[v]||v;s.appendChild(o)})}
    fill("zone",Object.keys(zones),zones); fill("type",Object.keys(typeLabels),typeLabels); fill("use",Object.keys(useLabels),useLabels); starfield(); draw(); renderPanel(); renderLegend(); addEventListener("resize",starfield);
  </script>
