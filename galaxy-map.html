ence)","Hook","Last official waystation","HG-T3"]},{"id":"sorivaan-institute-annex","name":"Sorivaan Institute Annex","x":1260,"y":150,"zone":"lawless","faction":"independent","type":"scientific-expedition","status":"active","isCampaign":true,"showOnGalaxy":true,"systemRole":"auto","planetCount":0,"orbitIndex":0,"orbitAngle":0,"desc":"Station; Abandoned / Dr. Korin interest; jump point SI-0.441. Chart note: Kael's old outpost. The frontier research outpost where Kael was stationed when he discovered the Device. Officially shut down after his \"accident.\" Dr. Vetha Korin's people have been seen near it recently. Kael's old lab notes may still be here — and whatever else he left behind when he ran.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"SI-0.441","tags":["atlas","Station","Abandoned / Dr. Korin interest","Hook","Kael's old outpost","SI-0.441","◉ Hook","★ Visited"]},{"id":"wreck-of-the-exodus-chain","name":"Wreck of the Exodus Chain","x":1548,"y":2040,"zone":"lawless","faction":"independent","type":"derelict-ship","status":"active","isCampaign":false,"showOnGalaxy":true,"systemRole":"auto","planetCount":0,"orbitIndex":0,"orbitAngle":0,"desc":"Derelict; None / Salvagers; jump point EX-0.993. Scattered debris of four first-wave generation ships that collided after a navigation failure ~2,000 years ago. The wreck field spans 200,000 km. Salvagers have been picking it clean for centuries. But the deepest wreck is still transmitting — a signal no one has matched to any known format. The beacon database flags the field as a hazard and says nothing else.","sessionLog":"","parentId":"","pois":[],"jumpPoint":"EX-0.993","tags":["atlas","Derelict","None / Salvagers","Hook","EX-0.993"]},{"id":"the-quarantine-ring","name":"The Quarantine Ring","x":1179,"y":2046,"zone":"lawless","faction":"independent","type":"station","status":"dark","isCampaign":false,"showOnGalaxy":true,"systemRole":"auto","planetCount":0,"orbitIndex":0,"orbitAngle":0,"desc":"Station; None / Quara lanet","planetCount":0,"orbitIndex":2,"orbitAngle":102,"desc":"","sessionLog":"","parentId":"caelith","pois":[],"jumpPoint":"","tags":[]},{"id":"caelith-iii","name":"Caelith Prime","x":1473,"y":235,"zone":"frontier","faction":"independent","type":"planet","status":"active","isCampaign":true,"showOnGalaxy":false,"systemRole":"planet","planetCount":0,"orbitIndex":3,"orbitAngle":149,"desc":"Caelith — a mid-rim world about two jumps from the frontier boundary, close enough to the core to have real infrastructure and far enough out to have stopped caring about political niceties. Multi-species from the ground up — it was settled jointly by three species in its first century and never became anyone's homeworld, which is half the reason it works. The cities are built to accommodate everyone: wide transit corridors, variable gravity zones in the residential districts, atmospheric mixing in the public spaces. It has a reputation as one of the more genuinely livable places in the mid-rim precisely because no single species ever got to decide what livable meant.","sessionLog":"The crew sits in six vertical zones connected by an elevated rail system — a design common on Caelith where the mixed population density made vertical expansion more practical than sprawl. Gardens on every terrace level. Buildings with enough space between them that light and air move freely. The kind of place that doesn't try to impress you because it stopped needing to a long time ago.","parentId":"caelith","pois":[],"jumpPoint":"","tags":["◉ Hook","★ Visited"]},{"id":"caelith-iv","name":"Caelith IV","x":1473,"y":235,"zone":"frontier","faction":"independent","type":"planet","status":"active","isCampaign":false,"showOnGalaxy":false,"systemRole":"planet","planetCount":0,"orbitIndex":4,"orbitAngle":196,"desc":"","sessionLog":"","parentId":"caelith","pois":[],"jumpPoint":"","tags":[]},{"id":"caelith-v","name":"Caelith V","x":1473,"y":235,"zone":"frontier","faction":"independent","type":"planet","status":"a . the second thing was a hitchhiker. Dressed like a cowboy, and appearing as a distorted VHS cassette projection. Aria has no scans of him not visual or audio or anything else. He thanked them for picking him up, saying he was waiting for a long time. He told them they will see him again, later, and he vanished.","parentId":"","pois":[{"name":"A golden ribbon in space, unstable currently not there.","notes":""},{"name":"Something is in it, a star system, an organic ship or creature, a monster AUs wide","notes":""}],"jumpPoint":"","tags":["◉ Hook","★ Visited"]}],"routes":[{"id":"r1","from":"concordat-central","to":"stellaris-prime","type":"major","jumps":1},{"id":"r2","from":"concordat-central","to":"vesta-iii","type":"major","jumps":1},{"id":"r3","from":"concordat-central","to":"veras","type":"major","jumps":1},{"id":"r4","from":"concordat-central","to":"draal-prime","type":"major","jumps":1},{"id":"r5","from":"stellaris-prime","to":"freehaven","type":"trade","jumps":2},{"id":"r6","from":"stellaris-prime","to":"gilead-station","type":"trade","jumps":1},{"id":"r7","from":"stellaris-prime","to":"new-cardiff","type":"trade","jumps":1},{"id":"r8","from":"vesta-iii","to":"helix-7","type":"trade","jumps":2},{"id":"r10","from":"freehaven","to":"new-cardiff","type":"trade","jumps":1},{"id":"r17","from":"helix-7","to":"freehaven","type":"campaign","jumps":5},{"id":"atlas-concordat-central-new-covenant","from":"concordat-central","to":"new-covenant","type":"major","jumps":1},{"id":"atlas-concordat-central-kethra-prime","from":"concordat-central","to":"kethra-prime","type":"major","jumps":3},{"id":"atlas-concordat-central-nisar","from":"concordat-central","to":"nisar","type":"major","jumps":1},{"id":"atlas-concordat-central-synthesis-system","from":"concordat-central","to":"synthesis-system","type":"major","jumps":1},{"id":"atlas-new-harmony-stellaris-prime","from":"new-harmony","to":"stellaris-prime","type":"major","jumps":1},{"id":"atlas-vesta-iii-helix-prime-station","from"     map.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches.length===1&&isDragging){const rect=map.getBoundingClientRect();const dx=(e.touches[0].clientX-dragStart.x)/rect.width*(3900/state.zoom);const dy=(e.touches[0].clientY-dragStart.y)/rect.height*(3000/state.zoom);state.suppressClick=true;state.pan.x=panStart.x-dx;state.pan.y=panStart.y-dy;updateViewBox()}else if(e.touches.length===2){const next=touchDistance(e.touches);const midpoint=touchMidpoint(e.touches);if(lastTouchDistance)zoomAt(midpoint,next/lastTouchDistance);lastTouchDistance=next;lastTouchMidpoint=midpoint}},{passive:false});
    map.addEventListener("touchend",()=>{isDragging=false;lastTouchDistance=null;lastTouchMidpoint=null;setTimeout(()=>{state.suppressClick=false},0)});
    function starfield(){const c=document.getElementById("starfield"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.fillStyle="#06060c";x.fillRect(0,0,c.width,c.height);let seed=4892,rand=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};for(let i=0;i<620;i++){x.beginPath();x.fillStyle=`rgba(240,231,190,${rand()*.65+.12})`;x.arc(rand()*c.width,rand()*c.height,(rand()*1.35+.25)*d,0,Math.PI*2);x.fill()}}
    document.getElementById("search").oninput=e=>{state.search=e.target.value;draw()}; document.getElementById("zone").onchange=e=>{state.zone=e.target.value;draw()}; document.getElementById("type").onchange=e=>{state.type=e.target.value;draw()}; document.getElementById("use").onchange=e=>{state.use=e.target.value;draw()}; document.getElementById("backBtn").onclick=()=>{state.view="galaxy";state.systemRootId=null;state.pan={x:-300,y:-240};state.zoom=1;updateViewBox();draw();renderPanel()}; document.getElementById("legendBtn").onclick=()=>{state.showLegend=!state.showLegend;renderLegend()};
    function fill(sel, vals, labels){const s=document.getElementById(sel);vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=labels[v]?.name||labels[v]||v;s.appendChild(o)})}
    fill("zone",Object.keys(zones),zones); fill("type",Object.keys(typeLabels),typeLabels); fill("use",Object.keys(useLabels),useLabels); starfield(); draw(); renderPanel(); renderLegend(); addEventListener("resize",starfield);
  </script>
